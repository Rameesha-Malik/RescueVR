<title>RescueVR Sequence</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>
  :root{
    --bg:#050506;
    --ground-line:#2fb8a8;
    --car-body:#8ec73f;
    --car-body-dark:#5f8f24;
    --car-glass:#2a2f26;
    --char:#c7c9cc;
    --char-dark:#8f9296;
    --text:#ffffff;
    --success:#3ddc84;
    --fail:#ff4d4f;
    --btn-bg:#ffffff;
    --btn-text:#0a0a0a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",Arial,Helvetica,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
  }
  .stage-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .label{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#6b6e73;
  }
  .stage{
    position:relative;
    width:min(90vw,760px);
    aspect-ratio:16/9;
    background:var(--bg);
    overflow:hidden;
    border-radius:4px;
  }
  .ground{
    position:absolute;
    left:0; right:0;
    top:64%;
    height:1px;
    background:var(--ground-line);
    opacity:0.9;
  }
  .prompt{
    position:absolute;
    top:14%;
    left:0; right:0;
    text-align:center;
    font-size:clamp(18px,3.4vw,26px);
    font-weight:700;
    padding:0 20px;
    text-wrap:balance;
    transition:opacity .25s ease;
  }
  .scene{
    position:absolute;
    left:50%; top:52%;
    transform:translate(-50%,-50%);
    width:82%;
    height:52%;
  }
  .car{
    position:absolute;
    left:2%; top:8%;
    width:62%;
  }
  .victim{
    position:absolute;
    right:0; bottom:6%;
    width:44%;
  }
  .zone-dot{
    position:absolute;
    width:14px;height:14px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    opacity:0.95;
    transition:transform .18s ease, opacity .18s ease;
  }
  .zone-dot.done{ opacity:0.35; transform:translate(-50%,-50%) scale(0.7); }
  .zone-pulse{ background:#ff5b5b; right:16%; top:18%; }
  .zone-breathing{ background:#4fc8ff; right:9%; top:9%; }
  .zone-neck{ background:#ffe14f; right:2%; top:0%; }

  .btn{
    position:absolute;
    left:50%; bottom:12%;
    transform:translateX(-50%);
    background:var(--btn-bg);
    color:var(--btn-text);
    font-family:"Inter",Arial,sans-serif;
    font-weight:800;
    font-size:clamp(14px,2.2vw,18px);
    padding:12px 28px;
    border-radius:2px;
    letter-spacing:0.01em;
    box-shadow:0 0 0 0 rgba(255,255,255,0);
    transition:box-shadow .3s ease, transform .15s ease;
  }
  .btn.pressed{ transform:translateX(-50%) scale(0.94); }
  .btn.glow{ box-shadow:0 0 0 6px rgba(255,255,255,0.12); }

  .result{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease, background .3s ease;
  }
  .result.show{
    opacity:1;
    background:rgba(0,0,0,0.55);
  }
  .result-text{
    font-size:clamp(20px,4vw,32px);
    font-weight:800;
    letter-spacing:0.01em;
    text-align:center;
    padding:0 20px;
    text-wrap:balance;
  }
  .result.success .result-text{ color:var(--success); }
  .result.fail .result-text{ color:var(--fail); }

  .progress{
    display:flex;
    gap:8px;
  }
  .progress .seg{
    width:34px; height:4px;
    background:#26272a;
    border-radius:2px;
    overflow:hidden;
  }
  .progress .seg .fill{
    height:100%; width:0%;
    background:#ffffff;
    transition:width .2s linear;
  }
  .progress .seg.active .fill{ width:100%; }
  .progress .seg.pending .fill{ width:0%; }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>

<div class="stage-wrap">
  <div class="label">RescueVR &mdash; AR Sequence Preview</div>

  <div class="stage" id="stage">
    <div class="ground"></div>

    <div class="prompt" id="prompt">Check the victim's pulse.</div>

    <div class="scene">
      <svg class="car" viewBox="0 0 220 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- flat-roofed boxy hatchback body, matching the actual model's silhouette -->
        <path d="M6 66 L14 40 Q18 30 30 29 L54 27 L150 22 Q172 22 182 34 L206 52 L206 66 Q206 72 198 72 L16 72 Q6 72 6 66 Z"
              fill="var(--car-body)" stroke="var(--car-body-dark)" stroke-width="2"/>
        <!-- windshield + rear window, dark glass -->
        <path d="M40 30 L60 28 L64 48 L36 49 Z" fill="var(--car-glass)"/>
        <path d="M96 24 L148 22 L156 46 L100 47 Z" fill="var(--car-glass)"/>
        <!-- roof rail accent -->
        <path d="M30 29 L150 22" stroke="var(--car-body-dark)" stroke-width="1.5" opacity="0.7"/>
        <!-- wheels, sitting low with visible dark struts hanging beneath the body (damaged look) -->
        <path d="M36 66 L30 92" stroke="#2a2a2c" stroke-width="4" stroke-linecap="round"/>
        <path d="M76 66 L68 96" stroke="#2a2a2c" stroke-width="4" stroke-linecap="round"/>
        <path d="M150 66 L160 90" stroke="#2a2a2c" stroke-width="4" stroke-linecap="round"/>
        <circle cx="46" cy="68" r="17" fill="#0a0a0b" stroke="#3a3a3d" stroke-width="3"/>
        <circle cx="46" cy="68" r="6" fill="#26262a"/>
        <circle cx="168" cy="68" r="17" fill="#0a0a0b" stroke="#3a3a3d" stroke-width="3"/>
        <circle cx="168" cy="68" r="6" fill="#26262a"/>
      </svg>

      <svg class="victim" viewBox="0 0 220 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- elongated, sprawled pose overlapping the car's rear, matching the actual model -->
        <path d="M4 40 Q26 30 52 33 L110 40 Q140 44 168 34 Q188 27 208 30"
              stroke="var(--char)" stroke-width="15" stroke-linecap="round" fill="none"/>
        <circle cx="18" cy="42" r="15" fill="var(--char)"/>
        <path d="M70 40 L64 66" stroke="var(--char-dark)" stroke-width="11" stroke-linecap="round"/>
        <path d="M120 42 L128 70" stroke="var(--char-dark)" stroke-width="11" stroke-linecap="round"/>
        <path d="M170 34 L206 24" stroke="var(--char-dark)" stroke-width="9" stroke-linecap="round"/>
      </svg>

      <div class="zone-dot zone-pulse" id="dot-pulse"></div>
      <div class="zone-dot zone-breathing" id="dot-breathing"></div>
      <div class="zone-dot zone-neck" id="dot-neck"></div>
    </div>

    <button class="btn" id="liftBtn">Lift Patient</button>

    <div class="result" id="result">
      <div class="result-text" id="resultText"></div>
    </div>
  </div>

  <div class="progress">
    <div class="seg" id="seg-pulse"><div class="fill"></div></div>
    <div class="seg" id="seg-breathing"><div class="fill"></div></div>
    <div class="seg" id="seg-neck"><div class="fill"></div></div>
    <div class="seg" id="seg-lift"><div class="fill"></div></div>
  </div>
</div>

<script>
(function(){
  var prompt = document.getElementById('prompt');
  var liftBtn = document.getElementById('liftBtn');
  var result = document.getElementById('result');
  var resultText = document.getElementById('resultText');
  var dots = {
    pulse: document.getElementById('dot-pulse'),
    breathing: document.getElementById('dot-breathing'),
    neck: document.getElementById('dot-neck')
  };
  var segs = {
    pulse: document.getElementById('seg-pulse'),
    breathing: document.getElementById('seg-breathing'),
    neck: document.getElementById('seg-neck'),
    lift: document.getElementById('seg-lift')
  };

  var prompts = {
    pulse: "Check the victim's pulse.",
    breathing: "Check the victim's breathing.",
    neck: "Apply the neck brace.",
    ready: "All checks complete — lift the patient."
  };

  function resetVisual(){
    Object.values(dots).forEach(function(d){ d.classList.remove('done'); });
    Object.values(segs).forEach(function(s){ s.classList.remove('active'); });
    result.className = 'result';
    liftBtn.classList.remove('glow','pressed');
    prompt.style.opacity = 1;
    prompt.textContent = prompts.pulse;
  }

  function step(delay, fn){ return new Promise(function(res){ setTimeout(function(){ fn(); res(); }, delay); }); }

  function markDone(key, segKey){
    dots[key].classList.add('done');
    segs[segKey].classList.add('active');
  }

  function setPrompt(text){
    prompt.style.opacity = 0;
    setTimeout(function(){ prompt.textContent = text; prompt.style.opacity = 1; }, 180);
  }

  function pressLift(){
    liftBtn.classList.add('pressed');
    setTimeout(function(){ liftBtn.classList.remove('pressed'); }, 160);
  }

  async function playSuccessRun(){
    resetVisual();
    await step(1100, function(){});
    await step(700, function(){ markDone('pulse','pulse'); setPrompt(prompts.breathing); });
    await step(1100, function(){});
    await step(700, function(){ markDone('breathing','breathing'); setPrompt(prompts.neck); });
    await step(1100, function(){});
    await step(700, function(){ markDone('neck','neck'); setPrompt(prompts.ready); liftBtn.classList.add('glow'); });
    await step(1000, function(){});
    await step(500, function(){
      pressLift();
      segs.lift.classList.add('active');
      result.className = 'result show success';
      resultText.textContent = 'Great job! Patient stabilized.';
    });
    await step(2200, function(){});
  }

  async function playFailRun(){
    resetVisual();
    await step(1000, function(){});
    await step(700, function(){ markDone('pulse','pulse'); setPrompt(prompts.breathing); });
    await step(1300, function(){});
    await step(500, function(){
      pressLift();
      result.className = 'result show fail';
      resultText.textContent = 'SPINAL FRACTURE — Restart';
    });
    await step(2200, function(){});
  }

  async function loop(){
    /* eslint-disable no-constant-condition */
    while(true){
      await playSuccessRun();
      await playFailRun();
    }
  }

  loop();
})();
</script>
